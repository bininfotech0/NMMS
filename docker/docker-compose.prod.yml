services:
  postgres:
    ports: []

  api:
    build:
      target: prod
    ports: []
    volumes: []
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL}
      PORT: 3000
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      MEMBER_JWT_ACCESS_SECRET: ${MEMBER_JWT_ACCESS_SECRET}
      MEMBER_JWT_REFRESH_SECRET: ${MEMBER_JWT_REFRESH_SECRET}
      FEATURE_FLAG_ENCRYPTION_KEY: ${FEATURE_FLAG_ENCRYPTION_KEY}
      AADHAAR_HASH_SECRET: ${AADHAAR_HASH_SECRET}
      CARD_QR_SECRET: ${CARD_QR_SECRET}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      STORAGE_ROOT: /repo/storage

  web:
    build:
      target: prod
    ports: []
    volumes: []
    environment: []

  nginx:
    environment:
      WEB_UPSTREAM: web:80
    ports:
      - "80:80"
      - "443:443"
